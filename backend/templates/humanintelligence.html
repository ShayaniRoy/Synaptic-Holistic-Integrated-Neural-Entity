<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHINE | NEURAL INTERFACE</title>
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Orbitron:wght@500;900&display=swap');

        :root { 
            --void: #000000;
            --glass-bg: rgba(0, 0, 0, 0.75); 
            --text-main: #ffffff;
            --text-muted: #666666;
            --accent: #ff4500; 
            --aurora: #00d4ff;
            --fin-accent: #00ffaa;
            --mag: #ff00e6;
            --border: rgba(255, 255, 255, 0.08);
            --state-color: #00ff00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body { 
            height: 100vh; color: var(--text-main); 
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; 
            background: var(--void);
        }

        /* Top Navigation Bar */
        .top-nav { position: absolute; top: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; gap: 15px; }
        
        .top-nav h1 {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 2.5rem; letter-spacing: 15px;
            background: linear-gradient(to bottom, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.5));
        }

        .hub-nav-btn {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--aurora);
            color: var(--aurora);
            padding: 8px 25px;
            font-family: 'Orbitron';
            font-size: 0.7rem;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
        }

        .hub-nav-btn:hover {
            background: var(--aurora);
            color: #000;
            box-shadow: 0 0 25px var(--aurora);
            transform: translateY(-2px);
        }

        #universe { position: fixed; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at center, #0a0a15 0%, #000 100%); overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.8; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        .container { 
            width: 98vw; height: 75vh; 
            display: grid; 
            grid-template-columns: 300px 1fr;
            gap: 20px; padding: 20px; 
            position: relative; margin-top: 100px;
        }

        .sidebar { 
            display: flex; flex-direction: column; gap: 20px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(40px); border-radius: 35px; border: 1px solid var(--border);
            padding: 30px 20px; box-shadow: 0 0 40px rgba(0,0,0,1);
            overflow-y: auto; scrollbar-width: none;
        }

        .widget { background: rgba(255,255,255,0.02); border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.04); position: relative;}
        .label { font-size: 0.55rem; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; text-align: center; font-weight: 700; }

        .cam-frame { width: 90px; height: 90px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); background: #000; box-shadow: 0 0 20px rgba(255, 69, 0, 0.3); transition: 0.8s ease; position: relative; }
        .cam-frame.env { border-color: var(--aurora); width: 70px; height: 70px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .cam-btn { width: 100%; background: none; border: 1px solid var(--border); border-radius: 12px; font-size: 0.55rem; margin-top: 10px; cursor: pointer; padding: 8px; font-weight: 600; font-family: 'Orbitron'; color: var(--text-main); transition: 0.3s; }
        .cam-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .telemetry { margin-top: 15px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; display: block; }
        .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-family: 'Orbitron'; font-size: 0.5rem; }
        .bar-label { width: 40px; color: var(--text-muted); }
        .pct-val { width: 35px; color: var(--aurora); font-weight: bold; text-align: right; }
        .bar-bg { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .scan-line { position: absolute; top: 0; width: 100%; height: 2px; background: var(--mag); box-shadow: 0 0 10px var(--mag); animation: scan 2s linear infinite; display: block; z-index: 2; opacity: 0.5; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        .action-btn { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); 
            border-radius: 12px; padding: 10px; color: var(--text-muted); 
            font-size: 0.6rem; font-weight: 700; font-family: 'Orbitron'; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 5px;
        }
        .action-btn:hover { color: #fff; background: rgba(255,255,255,0.1); border-color: #fff; }
        .logout-btn:hover { color: #ff3333; border-color: #ff3333; background: rgba(255, 51, 51, 0.05); }

        .chat-main { display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
        .chat-column { 
            width: 100%; height: 100%; display: flex; flex-direction: column; 
            background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1000');
            background-size: cover; background-position: center;
            border-radius: 45px; border: 1px solid var(--border); overflow: hidden; 
            box-shadow: inset 0 0 100px #000, 0 25px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        #chat-log { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scrollbar-width: none; position: relative; z-index: 1; }
        .msg { padding: 18px 25px; border-radius: 25px; max-width: 85%; font-size: 0.95rem; line-height: 1.6; backdrop-filter: blur(15px); }
        .ai { background: rgba(0, 0, 0, 0.6); align-self: flex-start; color: #fff; border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 5px; border-left: 4px solid var(--aurora); }
        .user { background: rgba(188, 19, 254, 0.2); align-self: flex-end; color: white; border-bottom-right-radius: 5px; border-right: 4px solid var(--mag); }

        .input-wrap { flex-shrink: 0; padding: 30px; background: rgba(0, 0, 0, 0.8); border-top: 1px solid var(--border); position: relative; z-index: 5; }
        .input-box { background: rgba(20, 20, 20, 1); border-radius: 20px; padding: 12px 15px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); }
        #user-in { flex: 1; background: transparent; border: none; outline: none; font-size: 1rem; color: #fff; }
        .btn { background: none; border: none; color: #777; font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 35px; height: 35px; border-radius: 50%; }
        .btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        
        em-picker { position: absolute; bottom: 100px; left: 30px; z-index: 100; display: none; box-shadow: 0 10px 50px rgba(0,0,0,0.5); }

        .recording { color: var(--accent) !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="top-nav">
    <h1>SHINE</h1>
    <button class="hub-nav-btn" onclick="goToHub()">💠 NEURAL HUB</button>
</div>

<div id="universe"></div>

<div class="container">
    <aside class="sidebar">
        <div class="widget">
            <div class="label" id="neural-label">Human Emotion Analysis</div>
            <div id="neural-frame" class="cam-frame">
                <div id="scan-line" class="scan-line"></div>
                <video id="v-emo" autoplay muted></video>
            </div>
            
            <div id="telemetry" class="telemetry">
                <div class="bar-row"><span class="bar-label">JOY</span><div class="bar-bg"><div id="b-joy" class="bar-fill" style="background:#00ff88"></div></div><span class="pct-val" id="p-joy">0%</span></div>
                <div class="bar-row"><span class="bar-label">CALM</span><div class="bar-bg"><div id="b-calm" class="bar-fill" style="background:#00d4ff"></div></div><span class="pct-val" id="p-calm">0%</span></div>
                <div class="bar-row"><span class="bar-label">FOCUS</span><div class="bar-bg"><div id="b-focus" class="bar-fill" style="background:#ff00e6"></div></div><span class="pct-val" id="p-focus">0%</span></div>
                <div class="bar-row"><span class="bar-label">STRESS</span><div class="bar-bg"><div id="b-stress" class="bar-fill" style="background:#ff4500"></div></div><span class="pct-val" id="p-stress">0%</span></div>
            </div>

            <div id="emo-detect" style="text-align:center; font-size:0.5rem; margin-top:10px; color:var(--accent); font-weight:700; letter-spacing: 1px;">[ ANALYZING BIOMETRICS ]</div>
            <button class="cam-btn" onclick="toggleStream('emo')">BIND NEURAL</button>
        </div>

        <div class="widget">
            <div class="label">Environment Sync</div>
            <div class="cam-frame env"><video id="v-cap" autoplay muted></video></div>
            <button class="cam-btn" onclick="toggleStream('cap')" style="color:var(--aurora);">SYNC FEED</button>
        </div>
        
        <div style="margin-top: auto;">
            <button class="action-btn logout-btn" onclick="logoutSession()">⏻ LOGOUT</button>
        </div>
    </aside>

    <main class="chat-main">
        <div class="chat-column">
            <div id="chat-log">
                <div class="msg ai">Neural interface online. Welcome back.</div>
            </div>

            <em-picker id="emoji-picker" data-theme="dark"></em-picker>

            <div class="input-wrap">
                <div class="input-box">
                    <input type="file" id="file-upload" style="display:none;" onchange="handleFileUpload(this)">
                    <button class="btn" title="Upload" onclick="document.getElementById('file-upload').click()">📁</button>
                    <button class="btn" title="Neural Expression" onclick="toggleEmojiPicker()">😊📷</button>
                    
                    <input type="text" id="user-in" placeholder="Transmit neural command..." onkeypress="if(event.key==='Enter') send()">
                    
                    <button class="btn" id="voice-btn" onclick="toggleVoice()" title="Voice Command">🎙️</button>
                    <button class="btn" onclick="send()" style="color:var(--aurora)" title="Send">➤</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // Universe Stars
    const universe = document.getElementById('universe');
    for(let i=0; i<200; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2 + 'px';
        star.style.width = size; star.style.height = size;
        star.style.top = Math.random() * 100 + '%';
        star.style.left = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        universe.appendChild(star);
    }

    // Navigation
    function goToHub() { window.location.href = "/intelligence"; }

    // Voice Recognition Logic
    const voiceBtn = document.getElementById('voice-btn');
    const userIn = document.getElementById('user-in');
    let recognition;

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.onstart = () => voiceBtn.classList.add('recording');
        recognition.onend = () => voiceBtn.classList.remove('recording');
        recognition.onresult = (event) => {
            userIn.value = event.results[0][0].transcript;
            send(); 
        };
    }

    function toggleVoice() { if (recognition) recognition.start(); }

    // Emotion Logic
    function updateEmotions() {
        ['joy', 'calm', 'focus', 'stress'].forEach(emo => {
            const val = Math.floor(Math.random() * 100);
            document.getElementById(`b-${emo}`).style.width = val + '%';
            document.getElementById(`p-${emo}`).innerText = val + '%';
        });
    }
    setInterval(updateEmotions, 3000);

    function toggleEmojiPicker() {
        const p = document.getElementById('emoji-picker');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    document.querySelector('em-picker').addEventListener('emoji-select', e => {
        userIn.value += e.detail.native;
        document.getElementById('emoji-picker').style.display = 'none';
    });

    function append(c, t) { 
        const log = document.getElementById('chat-log'); 
        const d = document.createElement('div'); 
        d.className = `msg ${c}`; d.innerText = t; 
        log.appendChild(d); log.scrollTop = log.scrollHeight;
    }

    async function send() {
        const text = userIn.value.trim();
        if(!text) return;
        append('user', text);
        userIn.value = '';
        setTimeout(() => append('ai', "Neural pulse received. Processing intent..."), 600);
    }

    let streams = { emo: null, cap: null };
    async function toggleStream(type) {
        const vid = document.getElementById(type === 'emo' ? 'v-emo' : 'v-cap');
        if(streams[type]) {
            streams[type].getTracks().forEach(t => t.stop());
            streams[type] = null; vid.srcObject = null;
        } else {
            try {
                const s = await navigator.mediaDevices.getUserMedia({video: true});
                streams[type] = s; vid.srcObject = s;
            } catch(e) { alert("Visual Link Failed."); }
        }
    }

    function logoutSession() { if(confirm("Disconnect Neural Link?")) window.location.href = "/logout"; }
</script>
</body>
</html>
